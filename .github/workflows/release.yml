name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: python3 build.py "${GITHUB_REF_NAME}" | tee build.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(grep -o 'sha1=.*' build.txt | cut -d= -f2)
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "resource-pack-sha1=$SHA"
